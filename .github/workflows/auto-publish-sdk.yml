name: Auto-publish SDK, CLI, and MCP

# Publishes clients after every successful production deploy. Manual dispatch can
# pin a version.
# Gated by Production secrets (SDK_AUTO_PUBLISH_ENABLED + PUSH_TO_REPO_TOKEN).
# Setup: SETUP_SDK.md
on:
  workflow_run:
    workflows: ["Deploy to Production"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Client version (e.g. 0.1.0). Leave empty to auto-bump patch."
        required: false

concurrency:
  group: auto-publish-sdk
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      publish_enabled: ${{ steps.gate.outputs.publish_enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/check-publish-gate
        id: gate
        with:
          sdk_auto_publish_enabled: ${{ secrets.SDK_AUTO_PUBLISH_ENABLED }}
          push_to_repo_token: ${{ secrets.PUSH_TO_REPO_TOKEN }}

  version:
    needs: gate
    if: needs.gate.outputs.publish_enabled == 'yes'
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve client version
        id: plan
        env:
          GH_TOKEN: ${{ secrets.PUSH_TO_REPO_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          VERSION="${INPUT_VERSION:-$(python3 .github/scripts/next_sdk_version.py)}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Will publish SDK + CLI + MCP version $VERSION"

  publish:
    needs: version
    uses: ./.github/workflows/publish-sdk.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # ARTPARK-SAHAI-ORG/calibrate syncs docs from the live public spec and
  # client repos (SDK reference, CLI command pages). Wait for publish so
  # calibrate-cli/docs/ is already pushed before the docs workflow clones it.
  sync-docs:
    needs: [version, publish]
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Trigger docs sync
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_REPO_TOKEN }}
        run: |
          gh api repos/ARTPARK-SAHAI-ORG/calibrate/dispatches \
            -f event_type=sync-api-spec \
            -f "client_payload[version]=${{ needs.version.outputs.version }}"
          echo "Triggered sync-api-spec on ARTPARK-SAHAI-ORG/calibrate"

  # dalmia/calibrate-skills drift-checks its agent skills against the live public
  # spec (the skills hardcode CLI flags + payload shapes). Same dispatch as
  # sync-docs. Reuses PUSH_TO_REPO_TOKEN: the fine-grained PAT (owner dalmia)
  # already lists calibrate-skills with Contents: write, which is what
  # repository_dispatch needs — so no separate secret.
  sync-skills:
    needs: [version, publish]
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Trigger skills sync
        env:
          GH_TOKEN: ${{ secrets.PUSH_TO_REPO_TOKEN }}
        run: |
          gh api repos/dalmia/calibrate-skills/dispatches \
            -f event_type=sync-api-spec \
            -f "client_payload[version]=${{ needs.version.outputs.version }}"
          echo "Triggered sync-api-spec on dalmia/calibrate-skills"
